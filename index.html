<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="云岭" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <title>云岭</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
        overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      /* 放大时保持像素方块，不要变糊 */
      #game canvas { image-rendering: crisp-edges; image-rendering: pixelated; }
      /* 手机竖着拿时，提示横过来 */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
        background: #1E1A1F; color: #EFE4C8; font: 20px "PingFang SC", sans-serif; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
